plugins {
    id 'com.android.application' version '9.4.0'
}

android {
    namespace = 'com.coastlinerush.game'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.coastlinerush.game'
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled = false
        }

        release {
            minifyEnabled = false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']

            // IMPORTANT:
            // Do NOT use the repository root as the Android assets directory.
            assets.srcDirs = ["${project.buildDir}/generated-web-assets"]
        }
    }
}

// Copy only the game files into a generated assets directory.
// This keeps the repository root completely flat.
tasks.register('prepareWebAssets', Sync) {
    from(project.projectDir) {
        include 'index.html'
    }

    into("${project.buildDir}/generated-web-assets")
}

// Make sure Android prepares the web assets before merging them.
tasks.named('mergeDebugAssets') {
    dependsOn 'prepareWebAssets'
}
