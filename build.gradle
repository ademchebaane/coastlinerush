plugins {
    id 'com.android.application' version '9.4.0'
}

// Generate a clean Java source directory from the root MainActivity.java.
def generatedJava = tasks.register('prepareJavaSource', Sync) {
    from(layout.projectDirectory.file('MainActivity.java'))
    into(layout.buildDirectory.dir('generated/source/main/java'))
}

// Generate a clean Android assets directory from the root index.html.
def generatedWebAssets = tasks.register('prepareWebAssets', Sync) {
    from(layout.projectDirectory.file('index.html'))
    into(layout.buildDirectory.dir('generated/web-assets'))
}

android {
    namespace = 'com.coastlinerush.game'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.coastlinerush.game'
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled = false
        }

        release {
            minifyEnabled = false
        }
    }

    sourceSets {
        main {
            // Keep the manifest at the repository root.
            manifest.srcFile 'AndroidManifest.xml'

            // DO NOT use the repository root as a Java source directory.
            java.srcDir(generatedJava)

            // DO NOT use the repository root as an assets directory.
            assets.srcDir(generatedWebAssets)
        }
    }
}

// Make sure generated Java and web assets exist before Android build tasks run.
tasks.named('preBuild').configure {
    dependsOn(generatedJava, generatedWebAssets)
}
