plugins {
    id 'com.android.application' version '9.4.0'
}

android {
    namespace 'com.coastlinerush.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.coastlinerush.game'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            assets.srcDirs = ['.']
            assets.include '**/index.html'
        }
    }
}
