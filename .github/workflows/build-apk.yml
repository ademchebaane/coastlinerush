      - name: Prepare Android sources
        run: |
          rm -rf generated
          mkdir -p generated/java/com/coastlinerush/game
          mkdir -p generated/assets

          cp MainActivity.java generated/java/com/coastlinerush/game/MainActivity.java
          cp index.html generated/assets/index.html

          echo "Generated files:"
          find generated -type f -print

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug 2>&1 | tee gradle-build.log

      - name: Show APKs
        if: always()
        run: |
          find build -type f -name '*.apk' -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Coastline-Rush-APK
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Coastline-Rush-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
