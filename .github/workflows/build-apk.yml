name: Coastline Rush

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --version
          test -f build.gradle
          test -f settings.gradle
          test -f AndroidManifest.xml
          test -f MainActivity.java
          test -f index.html
          test ! -d app

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug 2>&1 | tee gradle-build.log

      - name: Show APKs
        if: always()
        run: |
          echo '--- APK files ---'
          find build -type f -name '*.apk' -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Coastline-Rush-APK
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Coastline-Rush-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
